name: Test QuickChat Part 3

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: QuickChat-Part3/pom.xml

      - name: Run QuickChat Part 3 tests
        run: mvn --batch-mode clean test
        working-directory: QuickChat-Part3
